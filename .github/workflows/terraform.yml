name: terraform
on:
  pull_request:
    paths: ["infra/**", "lambda/**"]
  push:
    branches: [main]
    paths: ["infra/**", "lambda/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, staging]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-dev:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.environment == 'dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::581601708024:role/github-actions-terraform-dev
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend-config=backends/dev.hcl
      - run: terraform validate
      - uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: infra
          soft_fail: false
      - run: terraform plan -no-color -var-file=dev.tfvars
      - if: github.event_name == 'push'
        run: terraform apply -auto-approve -var-file=dev.tfvars

  deploy-staging:
    if: inputs.environment == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::156192247867:role/github-actions-terraform-staging
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend-config=backends/staging.hcl
      - run: terraform plan -no-color -var-file=staging.tfvars
      - run: terraform apply -auto-approve -var-file=staging.tfvars
